<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zonnedak Venray</title>
<meta name="theme-color" content="#0d1319" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --fg:#1d1a14; --muted:#77705f; --line:#e7dfcd;
  --sun:#e08a00; --sun2:#f5b83d; --glow:rgba(245,184,61,.28); --cloud:#8a94a0;
  --display:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --body:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d1319; --card:#151d26; --fg:#eef2f5; --muted:#8d9aa7; --line:#222d39;
    --sun:#ffb72e; --sun2:#ffd27a; --glow:rgba(255,183,46,.22); --cloud:#7f8b97; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0))}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 48px;display:grid;gap:16px}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:1.5rem}
h2{font-size:1.05rem}
.sub{color:var(--muted);margin:2px 0 0;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;min-width:0}

/* hero */
.hero{position:relative;overflow:hidden;padding-bottom:12px}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.kicker{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-weight:700;font-size:4rem;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.big small{font-size:1.4rem;font-weight:500;color:var(--muted);margin-left:4px}
.mood{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
.mood svg{width:22px;height:22px;flex:none}
.curve{margin:14px -8px 0}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font:500 11px var(--body)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b small{font-size:.75rem;font-weight:500;color:var(--muted);margin-left:2px}
.stat span{font-size:.75rem;color:var(--muted)}

/* week */
.week{display:grid;gap:4px;margin-top:10px}
.row{display:grid;grid-template-columns:92px 24px 1fr 76px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{font-weight:600}
.row .d small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.row svg{width:24px;height:24px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sun),var(--sun2))}
.row .v{text-align:right;white-space:nowrap;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.row .v small{font-weight:500;color:var(--muted);font-size:.75rem}
.note{font-size:.78rem;color:var(--muted);text-align:center}
.note a{color:inherit}
.err{color:var(--sun)}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Zonnedak Venray</h1>
    <p class="sub">3,01 kWp · zuid · 35°</p>
  </header>

  <section class="card hero" aria-labelledby="k-today">
    <div class="kicker" id="k-today">Vandaag verwacht</div>
    <div class="big" id="todayKwh">…</div>
    <div class="mood" id="todayMood">Verwachting wordt opgehaald…</div>
    <div class="curve" id="curve"></div>
    <div class="stats">
      <div class="stat"><b id="nowKw">–</b><span>nu</span></div>
      <div class="stat"><b id="peakKw">–</b><span id="peakAt">piek</span></div>
      <div class="stat"><b id="restKwh">–</b><span>nog te gaan</span></div>
    </div>
  </section>

  <section class="card" aria-labelledby="k-week">
    <h2 id="k-week">Komende dagen</h2>
    <div class="week" id="week"></div>
  </section>

  <p class="note">Schatting op basis van <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. Wolken kunnen het flink anders maken. Bijgewerkt <span id="updated">–</span></p>
</main>

<script>
const LAT = 51.53, LON = 5.98;                 // Venray
const KWP = 3.01, TILT = 35, AZ = 0, PR = 0.85, INV = 2.5;
const $ = id => document.getElementById(id);
const fmt = (n, d=1) => n.toLocaleString("nl-NL", {minimumFractionDigits:d, maximumFractionDigits:d});
const pad = n => String(n).padStart(2,"0");
const hhmm = t => `${pad(Math.floor(t))}:${pad(Math.round((t%1)*60))}`;

const ICON = {
  sun: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="var(--sun)"/><g stroke="var(--sun)" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>`,
  part: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="4" fill="var(--sun)"/><g stroke="var(--sun)" stroke-width="1.6" stroke-linecap="round"><path d="M9 1.8v1.8M1.8 9h1.8M3.9 3.9l1.3 1.3M14.1 3.9l-1.3 1.3"/></g><path d="M8 20h10a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.5 1.4A2.8 2.8 0 0 0 8 20z" fill="var(--cloud)"/></svg>`,
  cloud: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 19h11a4 4 0 0 0 .4-8 6 6 0 0 0-11.5 1.8A3.1 3.1 0 0 0 6.5 19z" fill="var(--cloud)"/></svg>`
};
const moodOf = c => c < 35 ? ["sun","Zonnig"] : c < 75 ? ["part","Wisselend bewolkt"] : ["cloud","Bewolkt"];

let DAYS = [];

async function load(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
    `&hourly=global_tilted_irradiance,cloud_cover&tilt=${TILT}&azimuth=${AZ}` +
    `&timezone=Europe%2FAmsterdam&forecast_days=7`;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const by = {};
    d.hourly.time.forEach((ts,i) => {
      const date = ts.slice(0,10), h = parseInt(ts.slice(11,13),10);
      const kw = Math.min(Math.max(0, d.hourly.global_tilted_irradiance[i] || 0) / 1000 * KWP * PR, INV);
      // waarde op uur H = gemiddelde over (H-1 tot H): middelpunt H-0,5
      (by[date] ||= {date, pts:[], cloud:[]}).pts.push({t: h - 0.5, kw});
      if (h >= 9 && h <= 16) by[date].cloud.push(d.hourly.cloud_cover[i]);
    });
    DAYS = Object.values(by).map(x => ({...x,
      kwh: x.pts.reduce((a,p) => a + p.kw, 0),
      peak: x.pts.reduce((a,p) => p.kw > a.kw ? p : a, {kw:0, t:12}),
      cloudAvg: x.cloud.reduce((a,c) => a + c, 0) / Math.max(1, x.cloud.length)
    }));
    render();
  } catch(e){
    $("todayMood").innerHTML = `<span class="err">De verwachting kon niet worden opgehaald. Probeer het over een paar minuten opnieuw.</span>`;
  }
}

function kwAt(pts, t){
  if (t <= pts[0].t || t >= pts[pts.length-1].t) return 0;
  const i = pts.findIndex(p => p.t > t), a = pts[i-1], b = pts[i];
  return a.kw + (b.kw - a.kw) * (t - a.t) / (b.t - a.t);
}

function smoothPath(P){
  let d = `M${P[0][0]},${P[0][1]}`;
  for (let i = 0; i < P.length - 1; i++){
    const p0 = P[i-1] || P[i], p1 = P[i], p2 = P[i+1], p3 = P[i+2] || p2;
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = Math.min(p1[1] + (p2[1]-p0[1])/6, BASE);
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = Math.min(p2[1] - (p3[1]-p1[1])/6, BASE);
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
let BASE = 0;

function render(){
  const today = DAYS[0];
  const now = new Date(), tNow = now.getHours() + now.getMinutes()/60;

  $("todayKwh").innerHTML = `${fmt(today.kwh)}<small>kWh</small>`;
  const [ic, word] = moodOf(today.cloudAvg);
  $("todayMood").innerHTML = `${ICON[ic]}<span>${word} · ${Math.round(today.cloudAvg)}% bewolking overdag</span>`;

  const nowKw = kwAt(today.pts, tNow);
  $("nowKw").innerHTML = `${fmt(nowKw,2)}<small>kW</small>`;
  $("peakKw").innerHTML = `${fmt(today.peak.kw,2)}<small>kW</small>`;
  $("peakAt").textContent = `piek rond ${hhmm(today.peak.t)}`;
  const rest = today.pts.reduce((a,p) => {
    const start = p.t - 0.5, end = p.t + 0.5;
    if (end <= tNow) return a;
    return a + p.kw * Math.min(1, end - Math.max(start, tNow));
  }, 0);
  $("restKwh").innerHTML = `${fmt(rest)}<small>kWh</small>`;

  // zonnecurve 06:00 – 20:00
  const W = 520, H = 190, L = 8, R = 8, T = 18, B = 26, t0 = 6, t1 = 20;
  BASE = H - B;
  const maxKw = Math.max(1, Math.ceil(Math.max(...DAYS.slice(0,3).map(d => d.peak.kw)) * 2) / 2);
  const X = t => L + (W-L-R) * (t - t0) / (t1 - t0);
  const Y = kw => T + (H-T-B) * (1 - kw / maxKw);
  const pts = [[X(t0), Y(0)], ...today.pts.filter(p => p.t > t0 && p.t < t1).map(p => [X(p.t), Y(p.kw)]), [X(t1), Y(0)]];
  const line = smoothPath(pts);
  const area = `${line} L${X(t1)},${BASE} L${X(t0)},${BASE} Z`;
  const nx = X(Math.min(t1, Math.max(t0, tNow)));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verwachte zonnestroom vandaag per uur">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sun2)" stop-opacity=".75"/><stop offset="1" stop-color="var(--sun)" stop-opacity=".05"/></linearGradient>
      <clipPath id="past"><rect x="0" y="0" width="${nx}" height="${H}"/></clipPath>
    </defs>`;
  [0.5,1,1.5,2,2.5].filter(k => k < maxKw).forEach(k =>
    s += `<line x1="${L}" x2="${W-R}" y1="${Y(k)}" y2="${Y(k)}" stroke="var(--line)" stroke-dasharray="2 5"/><text x="${W-R}" y="${Y(k)-4}" text-anchor="end">${fmt(k,1)} kW</text>`);
  s += `<path d="${area}" fill="url(#g)"/>`;
  s += `<path d="${line}" fill="none" stroke="var(--sun)" stroke-width="3" stroke-linecap="round"/>`;
  s += `<path d="${area}" fill="var(--bg)" opacity=".45" clip-path="url(#past)"/>`;
  s += `<line x1="${L}" x2="${W-R}" y1="${BASE}" y2="${BASE}" stroke="var(--line)"/>`;
  [8,10,12,14,16,18].forEach(h => s += `<text x="${X(h)}" y="${H-6}" text-anchor="middle">${pad(h)}:00</text>`);
  if (tNow > t0 && tNow < t1){
    const ny = Y(nowKw);
    s += `<line x1="${nx}" x2="${nx}" y1="${T}" y2="${BASE}" stroke="var(--fg)" stroke-opacity=".35" stroke-dasharray="3 4"/>`;
    s += `<circle cx="${nx}" cy="${ny}" r="9" fill="var(--glow)"/><circle cx="${nx}" cy="${ny}" r="5" fill="var(--sun)" stroke="var(--card)" stroke-width="2"/>`;
    s += `<text x="${nx}" y="${T-4}" text-anchor="middle" style="fill:var(--fg)">nu</text>`;
  }
  s += `</svg>`;
  $("curve").innerHTML = s;

  // week
  const maxDay = Math.max(...DAYS.map(d => d.kwh), 1);
  $("week").innerHTML = DAYS.slice(1).map((d,i) => {
    const dt = new Date(d.date + "T12:00");
    const name = i === 0 ? "Morgen" : dt.toLocaleDateString("nl-NL", {weekday:"long"});
    const sub = dt.toLocaleDateString("nl-NL", {day:"numeric", month:"short"});
    const [ic, word] = moodOf(d.cloudAvg);
    return `<div class="row" title="${word}">
      <div class="d">${name[0].toUpperCase() + name.slice(1)}<small>${sub}</small></div>
      ${ICON[ic]}
      <div class="bar"><i style="width:${Math.max(3, d.kwh / maxDay * 100)}%"></i></div>
      <div class="v">${fmt(d.kwh)} <small>kWh</small></div>
    </div>`;
  }).join("");

  $("updated").textContent = now.toLocaleTimeString("nl-NL", {hour:"2-digit", minute:"2-digit"});
}

load();
setInterval(() => DAYS.length && render(), 60 * 1000);     // "nu" elke minuut bijwerken
setInterval(load, 30 * 60 * 1000);                          // verwachting elk half uur verversen
</script>
</body>
</html>
